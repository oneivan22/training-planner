ъ<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить упражнение</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="header-title">Планировщик тренировок</div>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="add.html">Добавить</a>
            <a href="history.html">История</a>
            <a href="calculator.html">Калькулятор</a>
        </nav>
    </header>

    <main class="container">
        <h2>Добавить упражнение</h2>

        <form id="addForm">
            <div class="form-group">
                <label for="day">День недели</label>
                <select id="day" required>
                    <option value="">Выберите день</option>
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                    <option value="Суббота">Суббота</option>
                    <option value="Воскресенье">Воскресенье</option>
                </select>
            </div>
            <div class="form-group">
                <label for="name">Название упражнения</label>
                <input type="text" id="name" placeholder="Например: Жим лёжа" required>
            </div>
            <div class="form-group">
                <label for="sets">Количество подходов</label>
                <input type="number" id="sets" placeholder="4" min="1" required>
            </div>
            <div class="form-group">
                <label for="reps">Количество повторений</label>
                <input type="number" id="reps" placeholder="8" min="1" required>
            </div>
            <div class="form-group">
                <label for="weight">Рабочий вес (кг)</label>
                <input type="number" id="weight" placeholder="80" min="0" required>
            </div>
            <button type="submit" class="btn-add">Добавить</button>
        </form>

        <p id="successMessage" style="display: none; color: green;">
            Упражнение добавлено!
        </p>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
