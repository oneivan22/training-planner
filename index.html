<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик тренировок</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header class="header">
        <div class="header-title">Планировщик тренировок</div>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="history.html">История</a>
            <a href="calculator.html">Калькулятор</a>
            <a href="ai-chat.html">AI-тренер</a>
        </nav>
    </header>

    <main class="container">
        <h2>Моя программа тренировок</h2>
        <div id="weekPlan"></div>
    </main>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">Добавить упражнение</h3>
            <form id="addForm">
                <div class="form-group">
                    <label>Название упражнения</label>
                    <input type="text" id="exName" placeholder="Например: Жим лёжа" required>
                </div>
                <div class="form-group">
                    <label>Количество подходов</label>
                    <input type="number" id="exSets" placeholder="4" min="1" max="10" required>
                </div>
                <div id="repsBlock"></div>
                <div class="form-group">
                    <label>Рабочий вес (кг)</label>
                    <input type="number" id="exWeight" placeholder="80" min="0" required>
                </div>
                <input type="hidden" id="currentDay">
                <button type="submit" class="btn btn-blue">Добавить</button>
            </form>
            <p id="successMsg" style="display:none;color:green;">Упражнение добавлено!</p>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/plan.js"></script>
    <script src="js/modal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var inp = document.getElementById('exSets');
            if (inp) inp.oninput = makeRepsInputs;
            setupAddForm();
            showPlan();
        });
    </script>
</body>
</html>
